networks:
  bridge:
    driver: bridge

services:
  db:
    image: postgres:16
    container_name: IBD_postgres_data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
    #   - IBD_postgres_data:/var/lib/postgresql/data
    - ./sql:/docker-entrypoint-initdb.d:ro
    - ./csv/imports:/imports:ro
    networks:
      - bridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 20

  python:
    build: ./python
    container_name: python_etl
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./python/outputs:/app/outputs
    networks:
      - bridge
    ports:
      - "8050:8050"
