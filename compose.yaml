networks:
  bridge:
    driver: bridge

services:
  db:
    image: postgres:16
    container_name: IBD_postgres_data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics
    ports:
      - "5678:5678"
    volumes:
      - IBD_postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - ./csv/imports:/imports:ro
    networks:
      - bridge

  python:
    build: ./python
    container_name: python_etl
    depends_on:
      - db
    networks:
      - bridge
    ports:
      - "8050:8050"
volumes:
  IBD_postgres_data:
